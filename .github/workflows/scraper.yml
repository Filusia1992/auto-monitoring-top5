name: Daily TOP5 Scraper

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Run scraper
        run: python scraper_mobile.py

      - name: Upload raw listings
        uses: actions/upload-artifact@v4
        with:
          name: top5_listings
          path: top5_listings.json

      - name: Upload filtered listings
        uses: actions/upload-artifact@v4
        with:
          name: top5_filtered
          path: top5_filtered.json
