name: Daily Scraper

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Kleinanzeigen scraper
        run: python scraper_kleinanzeigen.py

      - name: Upload Kleinanzeigen results
        uses: actions/upload-artifact@v4
        with:
          name: results_kleinanzeigen
          path: results_kleinanzeigen.json
