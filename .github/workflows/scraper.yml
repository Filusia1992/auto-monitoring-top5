name: Auto Scraper

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write   # <<< KLUCZOWE — pozwala na git push

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # <<< używamy prawidłowego tokena

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install requests
          pip install beautifulsoup4
          pip install geopy
          pip install pillow
          pip install pytesseract

      - name: Run scraper
        run: |
          python scraper_kleinanzeigen.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add results_kleinanzeigen.json
          git commit -m "Update results $(date)" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
