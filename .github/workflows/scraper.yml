name: Daily TOP5 Scraper

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install playwright
      - run: playwright install chromium
      - run: python scraper_top5.py
      - uses: actions/upload-artifact@v4
        with:
          name: top5_listings
          path: top5_listings.json
          def parse_price(price_str):
    try:
        return int(price_str.replace("€", "").replace(".", "").replace(",", "").strip())
    except:
        return None

def parse_year(title):
    import re
    match = re.search(r"(20\d{2})", title)
    return int(match.group(1)) if match else None

def filter_listing(listing):
    model = listing["model"]
    price = parse_price(listing["price"])
    year = parse_year(listing["title"])

    if price is None or year is None:
        return False

    # Model-specific rules
    if model == "Toyota Yaris Hybrid":
        return price <= 8000 and year >= 2017

    if model == "Toyota Auris Hybrid":
        return price <= 8000 and year >= 2016

    if model == "Kia Stonic 1.4 MPI":
        return price <= 8000 and year >= 2018

    if model == "Skoda Rapid 1.6 MPI":
        return price <= 8000 and year >= 2016

    if model == "Kia Ceed 1.4/1.6 MPI":
        return price <= 8000 and year >= 2016

    return False

# Save filtered results
filtered = [l for l in all_listings if filter_listing(l)]

with open("top5_filtered.json", "w", encoding="utf-8") as f:
    json.dump(filtered, f, indent=4, ensure_ascii=False)
