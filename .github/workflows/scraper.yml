name: Daily TOP5 Scraper

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install playwright
      - run: playwright install chromium
      - run: python scraper_top5.py
      - uses: actions/upload-artifact@v4
        with:
          name: top5_listings
          path: top5_listings.json
